<!DOCTYPE html>
<html lang="en" data-theme="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hunger Games Sim{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="top-nav">
        <a href="/" class="brand">🏹 Hunger Games Sim</a>
        
        <div class="nav-controls">
            <button id="themeToggle" class="btn theme-switch">
                <span id="themeIcon">☀️</span> Mode
            </button>
        </div>
    </header>

    <div class="app-container">
        
        <aside class="sidebar" id="appSidebar">
            {% block sidebar %}
            <h3>Navigation</h3>
            <p><a href="/" style="color: var(--text-primary)">Home</a></p>
            {% endblock %}
        </aside>

        <main class="main-content">
            <div id="flash-messages"></div>
            {% block content %}{% endblock %}
        </main>

    </div>

    <script>
        const html = document.documentElement;
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');

        // Check Local Storage
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        toggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcon(next);
        });

        function updateIcon(theme) {
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
